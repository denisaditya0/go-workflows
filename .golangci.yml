version: "2"

run:
  allow-parallel-runners: true

linters:
  enable:
    - bidichk
    - bodyclose
    - goprintffuncname
    - govet
    - importas
    - ineffassign
    - makezero
    - prealloc
    - predeclared
    - promlinter
    - rowserrcheck
    - staticcheck
    - tagalign
    - testifylint
    - tparallel
    - unconvert
    - wastedassign
    - whitespace
    - unused
    - goworkflows
  exclusions:
    rules:
      # The timer race test intentionally uses a real time.Sleep.
      - path: backend/test
        linters:
          - goworkflows
      # This sample deliberately uses a package-level counter to demonstrate
      # retry behaviour.
      - path: samples/retries
        linters:
          - goworkflows
  disable:
    - errname
    - errcheck
  settings:
    staticcheck:
      checks:
        - "all"
        - "-SA1019"
        - "-ST1000"
        - "-ST1003"
        - "-ST1005"
        - "-ST1012"
        - "-ST1020"
        - "-SA5010"
    custom:
      goworkflows:
        type: "module"
        original-url: "github.com/denisaditya0/go-workflows/analyzer"


formatters:
  enable:
    - gofmt
    # - goimports
  settings:
    goimports:
      local-prefixes:
        - "github.com/denisaditya0/go-workflows"
