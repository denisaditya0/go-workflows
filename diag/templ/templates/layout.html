{{define "layout"}}<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{.Title}} · go-workflows diag</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    pre { white-space: pre-wrap; word-break: break-word; margin: 0; }
    code { color: inherit; }
    .badge code { color: inherit; }
  </style>
</head>
<body>
  <div class="container my-4">
    <nav class="mb-4">
      <a href="{{.BasePath}}/" class="text-decoration-none">
        <h1 class="h4">go-workflows diagnostics</h1>
      </a>
    </nav>
    {{template "content" .}}
  </div>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>{{end}}

{{/* stateBadge renders a Bootstrap badge for an instance state.
     Expects a value with .Label and .Bg fields (StateBadge). */}}
{{define "stateBadge"}}<span class="badge text-bg-{{.Bg}}">{{.Label}}</span>{{end}}
