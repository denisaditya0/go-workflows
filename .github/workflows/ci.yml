name: CI

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build & Test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          check-latest: true
          cache: true

      - name: Build
        run: go build -v ./...

      - name: Vet
        run: go vet ./...

      - name: Check formatting
        run: |
          unformatted=$(gofmt -s -l .)
          if [ -n "$unformatted" ]; then
            echo "The following files are not formatted. Run 'make fmt':"
            echo "$unformatted"
            exit 1
          fi

      - name: Tests
        run: go test -short -timeout 240s -race -count 1 ./...

  test_analyzer:
    name: Workflow Analyzer Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: analyzer/go.mod
          check-latest: true
          cache: true
          cache-dependency-path: analyzer/go.sum

      - name: Tests
        working-directory: analyzer
        run: go test -race -timeout 240s -count 1 ./...

      - name: Build analyzer
        working-directory: analyzer
        run: go build -o ../goworkflows ./cmd/goworkflows

      - name: Analyze repository workflows
        # Excluded on purpose:
        # - backend/test uses wall-clock sleeps to exercise timing races.
        # - samples/retries uses a package-level counter to simulate transient
        #   workflow failures; that is itself a determinism hazard the rule flags.
        run: ./goworkflows $(go list ./... | grep -v -e '/backend/test' -e '/samples/retries')

  test_postgres:
    name: Postgres Backend Tests
    runs-on: ubuntu-latest
    needs: build

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: root
          POSTGRES_PASSWORD: root
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          check-latest: true
          cache: true

      - name: Tests
        run: go test -timeout 240s -race -count 1 ./backend/postgres/...
